# Declarative Automation Bundle: everything that runs on a schedule or serves users.
# Lakebase objects (project, synced table, Lakehouse Sync) and the Genie space are created by lakebase/setup.sh
# and genie/build_space.py, because bundles don't manage them yet. The gap-risk model is registered in Unity Catalog
# by its training notebook (ml/01_train_gap_risk.py).
bundle:
  name: larkwell-shelf-availability

include:
  - resources/*.yml

sync:
  exclude:
    - deck/**
    - evidence/**
    - docs/**
    - infra/.app_sp

variables:
  catalog:
    description: Unity Catalog catalog for the data product
    default: larkwell_osa
  business_date:
    description: Trading day the source systems are simulated for
    default: "2026-10-19"
  seed:
    description: Generator seed; the same seed and date always reproduce the same day exactly
    default: "20261017"
  anchor_date:
    description: The pinned trading day (exact headline counts); every other date is rolled from it day by day
    default: "2026-10-19"
  warehouse_id:
    description: SQL warehouse for the app's dashboards and for Genie
  llm_endpoint:
    description: Model serving endpoint that words the next best action
    default: databricks-claude-sonnet-4-5
  judge_endpoint:
    description: Model serving endpoint for the evaluation's LLM judges (a different model family from llm_endpoint)
    default: databricks-gpt-5-5
  genie_space_id:
    description: Genie space created by genie/build_space.py
  lakebase_sync_pipeline_id:
    description: Pipeline that refreshes the Lakebase synced table (created by lakebase/setup.sh)

targets:
  dev:
    default: true
    workspace:
      # Uses the CLI profile in DATABRICKS_CONFIG_PROFILE (or --profile).
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}
    variables:
      warehouse_id: 148ccb90800933a1
      genie_space_id: 01f1cae5fec71e36bda761a1c88b5cd6
      lakebase_sync_pipeline_id: 785890e0-6d95-439d-9cde-05f6bda436a2
