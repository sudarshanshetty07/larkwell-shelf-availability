command:
  - uvicorn
  - app:app
  - --host
  - 0.0.0.0
  - --port
  - "8000"
env:
  - name: DATABRICKS_WAREHOUSE_ID
    valueFrom: warehouse
  - name: SERVING_ENDPOINT_NAME
    valueFrom: llm
  - name: GENIE_SPACE_ID
    valueFrom: genie
  - name: UC_CATALOG
    value: larkwell_osa
  - name: LAKEBASE_ENDPOINT
    value: projects/larkwell-osa/branches/production/endpoints/primary
  - name: LAKEBASE_DATABASE
    value: databricks_postgres
